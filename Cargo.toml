[package]
name = "leaf"
version = "0.1.0"
edition = "2024"
description = "A lightweight, viewer-first text editor for macOS with lazy tabs"
license = "Apache-2.0"

[dependencies]
# gpui-kit pins the matching `gpui-pre` snapshot crates itself (=0.3.11 for 0.9.0).
# `syntect`: ~200 languages, small build. Swap to `tree-sitter` features later if needed.
gpui-kit = { version = "=0.9.0", features = ["syntect"] }
futures = "0.3"
chardetng = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
encoding_rs = "0.8"
memchr = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] } # keep JSON key order when formatting
# Oniguruma regexes: 2-4.5x less CPU and 15-35 MB less memory per language
# than fancy-regex in our measurements. With both features enabled syntect
# uses onig, which also switches gpui-component's editor highlighter.
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "regex-onig"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-onig"] }

# Disk-lean dev builds: no debug info, optimized dependencies (GPUI is slow unoptimized).
[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 0
lto = "fat"
codegen-units = 1
panic = "abort"   # no unwinding tables (~3 MB); a panic quits either way
strip = true
